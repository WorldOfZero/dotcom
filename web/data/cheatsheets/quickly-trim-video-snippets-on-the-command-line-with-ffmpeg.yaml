# Rendered under the page of the same name by layouts/partials/cheatsheet.html
title: "Trim a video without re-encoding"
intro: "Cuts a clip out of a longer video. Because it copies instead of re-encoding, a few minutes of a multi-hour stream takes only a few minutes."
command:
  - code: "ffmpeg"
    note: "the installed FFmpeg program"
  - code: " "
  - code: "-i original-video.mp4"
    note: "the input video to cut from"
  - code: " "
  - code: "-ss 00:05:00"
    note: "when to start the new clip (hour:minute:second); everything before it is skipped"
  - code: " "
  - code: "-to 00:10:00"
    note: "when to end the clip; only content up to this time is kept"
  - code: " "
  - code: "-c copy"
    note: "copy the streams instead of re-encoding them, which is what makes it fast"
  - code: " "
  - code: "edited-video.mp4"
    note: "the name of the new output video"
more:
  - code: "-ss or -to"
    note: "Both are optional: leave off -ss to start at the beginning, or -to to keep everything until the end."
  - code: "-an"
    note: "Removes the audio from the output file."
link:
  url: "https://ffmpeg.org/documentation.html"
  text: "FFmpeg documentation"
