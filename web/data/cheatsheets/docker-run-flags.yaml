# Rendered under the page of the same name by layouts/partials/cheatsheet.html
title: "docker run flags"
intro: "Serves the current folder at http://localhost:8080 using the nginx image."
command:
  - code: "docker run"
    note: "start a new container from an image"
  - code: " "
  - code: "--rm"
    note: "delete the container automatically when it exits, so stopped containers don't pile up"
  - code: " "
  - code: "-it"
    note: "-i keeps input open and -t gives it a terminal, so you see the logs and can stop it with Ctrl+C"
  - code: " "
  - code: "-p 8080:80"
    note: "publish a port as host:container, so localhost:8080 reaches port 80 inside the container"
  - code: " "
  - code: "-v ${PWD}:/usr/share/nginx/html"
    note: "mount a folder as host-path:container-path; here the current folder replaces nginx's web root"
  - code: " "
  - code: "nginx"
    note: "the image to run"
more:
  - code: "-d"
    note: "Run in the background (detached) instead of attaching your terminal."
  - code: "--name my-site"
    note: "Give the container a name so you can refer to it later."
  - code: "docker ps"
    note: "List running containers."
  - code: "docker stop my-site"
    note: "Stop a container by name or id."
link:
  url: "https://docs.docker.com/engine/reference/run/"
  text: "docker run reference"
