baseURL = "https://worldofzero.com/" # The URL of your site. Must be absolute so canonical, sitemap and og:url are valid.
title = "World of Zero" # Title of your site
theme = "zzo" # Name of Zzo theme folder in `themes/`.

defaultContentLanguage = "en" # Default language to use (if you setup multilingual)
defaultContentLanguageInSubdir = false # single language site: serve at baseURL/, not baseURL/en/
hasCJKLanguage = false # Set `true` for Chinese/Japanese/Korean languages.

summaryLength = 20 # The length of a post description on a list page.
buildFuture = true # if true, we can use future date for talks page

copyright = "©{year}, All Rights Reserved" # copyright symbol: $copy; current year: {year}
timeout = 10000
enableEmoji = true
paginate = 20 # Number of items per page in paginated lists.
rssLimit = 100

enableGitInfo = true # When true, the modified date will appear on a summary and single page. Since GitHub info needs to be fetched, this feature will slow down to build depending on a page number you have
googleAnalytics = "UA-18687431-5"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      hardWraps = true
      unsafe = true
      xHTML = true
  [markup.highlight]
    codeFences = true
    lineNos = true
    lineNumbersInTable = true
    noClasses = false
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2

[outputs]
  home = ["HTML", "RSS", "JSON"]

# Only tags are used, but the zzo theme's sidebar templates require the categories and series
# taxonomies to exist. Their (empty) list pages are noindexed in head/custom-head and left out of the sitemap.
[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

# Weight shared tags heavily so "Related" links point at topically similar videos and posts.
[related]
  includeNewer = true
  threshold = 20
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10

[sitemap]
  changefreq = "weekly"
  priority = 0.5
